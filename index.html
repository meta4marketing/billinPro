<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Product Cards</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>

<div class="container my-5">
  <div class="row" id="product-list">
    <!-- Product 1 -->
    <div class="col-md-4 mb-4 product-card" data-id="1">
      <div class="card h-100">
        <img src="https://picsum.photos/300/200?sofa" class="card-img-top" alt="Sofa">
        <div class="card-body">
          <h5 class="card-title">Luxury Sofa</h5>
          <p class="card-text">₹25,000 | Premium comfort sofa.</p>
        </div>
      </div>
    </div>

    <!-- Product 2 -->
    <div class="col-md-4 mb-4 product-card" data-id="2">
      <div class="card h-100">
        <img src="https://picsum.photos/300/200?bed" class="card-img-top" alt="Bed">
        <div class="card-body">
          <h5 class="card-title">King Size Bed</h5>
          <p class="card-text">₹40,000 | Spacious wooden bed.</p>
        </div>
      </div>
    </div>

    <!-- Product 3 -->
    <div class="col-md-4 mb-4 product-card" data-id="3">
      <div class="card h-100">
        <img src="https://picsum.photos/300/200?chair" class="card-img-top" alt="Chair">
        <div class="card-body">
          <h5 class="card-title">Office Chair</h5>
          <p class="card-text">₹8,000 | Ergonomic design chair.</p>
        </div>
      </div>
    </div>
  </div>
</div>

<script>
  // URL parameter read karo
  const urlParams = new URLSearchParams(window.location.search);
  const productId = urlParams.get('id');

  if(productId){
    document.querySelectorAll('.product-card').forEach(card => {
      if(card.dataset.id !== productId){
        card.style.display = 'none'; // hide other cards
      }
    });
  }
</script>

</body>
</html>
